[package]
name = "seele-rgb"
version = "0.1.0"
edition = "2024"
description = "Show machine load and service health through OpenRGB lighting, with a self-installing systemd setup"
license = "MIT OR Apache-2.0"
authors = ["2075"]
rust-version = "1.94"
readme = "README.md"
keywords = ["rgb", "openrgb", "monitoring", "systemd"]
categories = ["command-line-utilities"]
include = ["src/**", "assets/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "seele-rgb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bollard = "0.21.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
nvml-wrapper = "0.13.0"
parking_lot = "0.12.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.38.4"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
